networks:
  xroad-network:
    driver: bridge
  bknet:
    driver: bridge
    name: ruuter

services:
  cs:
    image: niis/xroad-central-server:bionic-6.26.0
    container_name: cs
    environment:
      XROAD_TOKEN_PIN: 123456xrd!
    ports:
      - "4000:4000"
      - "80:80"
      - "443:443"
    volumes:
      - cs-db-volume:/var/lib/postgresql/12/main
      - cs-conf-volume:/etc/xroad
    networks:
      - xroad-network

  ca:
    image: ghcr.io/nordic-institute/xrddev-testca:latest
    container_name: ca
    ports:
      - "8888:8888"
    volumes:
      - ca-volume:/home/ca
    networks:
      - xroad-network

  # Management Security Server
  ss1:
    image: niis/xroad-security-server-sidecar:6.26.0-fi
    container_name: ss1
    ports:
      - "1000:4000"
      - "1080:8080"
      - "1443:8443"
    environment:
      XROAD_TOKEN_PIN: 123456xrd!
      XROAD_ADMIN_USER: xrd
      XROAD_ADMIN_PASSWORD: secret
      XROAD_LOG_LEVEL: INFO
    volumes:
      - ss1-db-volume:/var/lib/postgresql
      - ss1-conf-volume:/etc/xroad
      - ss1-archive-volume:/var/lib/xroad
    networks:
      - xroad-network
    depends_on:
      - cs
      - ca

  ss2:
    image: niis/xroad-security-server-sidecar:6.26.0-fi
    container_name: ss2
    ports:
      - "2000:4000"
      - "2080:8080"
      - "2443:8443"
    environment:
      XROAD_TOKEN_PIN: 123456xrd!
      XROAD_ADMIN_USER: xrd
      XROAD_ADMIN_PASSWORD: secret
      XROAD_LOG_LEVEL: INFO
    volumes:
      - ss2-db-volume:/var/lib/postgresql
      - ss2-conf-volume:/etc/xroad
      - ss2-archive-volume:/var/lib/xroad
    networks:
      - xroad-network
    depends_on:
      - cs
      - ca

  ss3:
    image: niis/xroad-security-server-sidecar:6.26.0-fi
    container_name: ss3
    ports:
      - "3000:4000"
      - "3080:8080"
      - "3443:8443"
    environment:
      XROAD_TOKEN_PIN: 123456xrd!
      XROAD_ADMIN_USER: xrd
      XROAD_ADMIN_PASSWORD: secret
      XROAD_LOG_LEVEL: INFO
    volumes:
      - ss3-db-volume:/var/lib/postgresql
      - ss3-conf-volume:/etc/xroad
      - ss3-archive-volume:/var/lib/xroad
    networks:
      - xroad-network
    depends_on:
      - cs
      - ca

  provider-service:
    build: ./cadastre-rest
    container_name: provider-service
    ports:
      - "9000:9000"
    networks:
      - xroad-network

  postgres:
    image: postgres:16
    container_name: bk-postgres
    environment:
      POSTGRES_PASSWORD: pass
      POSTGRES_USER: bk
      POSTGRES_DB: bk
    ports:
      - "5438:5432"
    networks:
      - bknet

  adapter:
    build: ./adapter
    container_name: adapter
    environment:
      ADAPTER_MODE: DIRECT
      PROVIDER_BASE_URL: http://provider-service:9000
      XROAD_SS_URL: https://ss2:8443
      XROAD_VERIFY_TLS: "false"
      XROAD_CLIENT: DEV/ORG/BKTT/burokratt
      XROAD_SERVICE: DEV/ORG/CAD/cadastre/ehitis-andmed/v1
    depends_on:
      - ss2
      - postgres
    ports:
      - "7000:7000"
    networks:
      - bknet
      - xroad-network

  ruuter:
    build: ./Ruuter
    container_name: ruuter
    volumes:
      - ./dsl:/dsl
    depends_on:
      - adapter
      - postgres
    ports:
      - "5000:3000"
    networks:
      - bknet

volumes:
  cs-db-volume:
    name: cs-db-data
  cs-conf-volume:
    name: cs-conf-data
  ca-volume:
    name: ca-data

  ss1-db-volume:
    name: ss1-db-data
  ss1-conf-volume:
    name: ss1-conf-data
  ss1-archive-volume:
    name: ss1-archive-data

  ss2-db-volume:
    name: ss2-db-data
  ss2-conf-volume:
    name: ss2-conf-data
  ss2-archive-volume:
    name: ss2-archive-data

  ss3-db-volume:
    name: ss3-db-data
  ss3-conf-volume:
    name: ss3-conf-data
  ss3-archive-volume:
    name: ss3-archive-data
